---
# 节点类型：server 或 agent
rke2_type: "{{ 'server' if inventory_hostname in groups[rke2_servers_group_name] else 'agent' if inventory_hostname in groups[rke2_agents_group_name] }}"

# 以高可用模式部署控制平面
rke2_ha_mode: false

# 在 Server 节点安装并配置 Keepalived
# 使用已有负载均衡器时可以禁用
rke2_ha_mode_keepalived: true

# 为集群安装并配置 kube-vip API VIP
# 使用 kube-vip 时 rke2_ha_mode_keepalived 必须为 false
rke2_ha_mode_kubevip: false

# Kubernetes API 和 RKE2 注册地址，默认为首个 Server 节点的 IPv4 地址
# 高可用模式下应设置为 Keepalived 或 kube-vip 使用的静态 VIP
# 如果两者均未启用，则设置为已有负载均衡器的 IP 地址
rke2_api_ip: "{{ hostvars[groups[rke2_servers_group_name].0]['ansible_default_ipv4']['address'] | default(hostvars[groups[rke2_servers_group_name].0]['ansible_default_ipv6']['address'] ) }}"

# 可选：RKE2 Server 监听的私有 IP 地址和端口
# rke2_api_private_ip:
rke2_api_private_port: 9345

# 可选：kube-vip 的 IP 子网前缀长度
# rke2_api_cidr: 24

# 可选：kube-vip 使用的网络接口
# rke2_interface: eth0
# 可选：节点通告的 IPv4/IPv6 绑定地址
# rke2_bind_address: "{{ hostvars[inventory_hostname]['ansible_' + rke2_interface]['ipv4']['address'] }}"

# 指定 kube-vip 容器镜像
rke2_kubevip_image: ghcr.io/kube-vip/kube-vip:v0.9.2

# 为控制平面启用 kube-vip IPVS 负载均衡
rke2_kubevip_ipvs_lb_enable: false
# 使用 IPVS 内核模块为控制平面启用四层负载均衡
# 必须使用 kube-vip 0.4.0 或更高版本

# 可选：调整 leader election 参数，详见下方上游安装参数链接
# rke2_kubevip_leaseduration: 5
# rke2_kubevip_renewdeadline: 3
# rke2_kubevip_retryperiod: 1
# rke2_kubevip_loglevel: 4

# 可选：kube-vip 参数列表
# 完整参数参见 https://kube-vip.io/docs/installation/flags/
# rke2_kubevip_args: []
# - param: lb_enable
#   value: true
# - param: lb_port
#   value: 6443

# kube-vip 的 Prometheus 指标端口
rke2_kubevip_metrics_port: 2112

# 为 kube-vip API VIP 启用 ARP 模式
rke2_kubevip_arp_enable: true

# 为 RKE2 启用 kube-vip 控制平面 VIP
rke2_kubevip_cp_enable: true

# kube-vip 控制平面组件所在的命名空间
rke2_kubevip_cp_namespace: "kube-system"

# 为 kube-vip 控制平面 VIP 启用 leader election
rke2_kubevip_leaderelection_enable: true

# kube-vip DaemonSet Pod 的资源配置
rke2_kubevip_daemonset_resources: {}
#  requests:
#    memory: 40Mi

# 为 Kubernetes API TLS 证书添加额外 SAN
rke2_additional_sans: []

# 配置集群域名
# rke2_cluster_domain: cluster.example.net

# API Server 目标端口
rke2_apiserver_dest_port: 6443

# Server 节点污点
rke2_server_node_taints: []
  # - 'CriticalAddonsOnly=true:NoExecute'

# Agent 节点污点
rke2_agent_node_taints: []

# 其他 Server 或 Agent 节点注册并加入集群时使用的预共享令牌
rke2_token: defaultSecret12345

# 要安装的 RKE2 版本
rke2_version: v1.25.3+rke2r1

# RKE2 版本通道服务地址
rke2_channel_url: https://update.rke2.io/v1-release/channels

# RKE2 安装脚本地址
# 例如 Rancher 中国镜像：http://rancher-mirror.rancher.cn/rke2/install.sh
rke2_install_bash_url: https://get.rke2.io

# RKE2 本地数据目录
rke2_data_path: /var/lib/rancher/rke2

# 目标节点上存放 RKE2 构件的路径
rke2_artifact_path: /rke2/artifact

# 离线安装所需的 RKE2 构件
rke2_artifact:
  - sha256sum-{{ rke2_architecture }}.txt
  - rke2.linux-{{ rke2_architecture }}.tar.gz
  - rke2-images.linux-{{ rke2_architecture }}.tar.zst

# 下载构件的超时时间，单位为秒
rke2_artifact_fetch_timeout: 30

# 启用基于本地构件的离线部署策略
rke2_airgap_mode: false

# Ansible 控制端存放离线构件的本地源路径
rke2_airgap_copy_sourcepath: local_artifacts

# 从 rke2_airgap_copy_sourcepath 复制到节点的附加组件镜像包
# 列表中的文件扩展名必须与实际文件保持一致
rke2_airgap_copy_additional_tarballs: []

# 节点上存放离线附加镜像包的目录，参见 https://docs.rke2.io/install/airgap#tarball-method
rke2_tarball_images_path: "{{ rke2_data_path }}/agent/images"

# 启用条件镜像导入：在镜像目录中创建 .cache.json 文件
# RKE2 仅重新导入自上次导入后大小或修改时间发生变化的镜像包，此状态可跨重启保留
# 这样可以加快启动速度，但不再保证每次启动都重新导入镜像
# 参见 https://docs.rke2.io/install/airgap?airgap-load-images=Manually+Deploy+Images#enable-conditional-image-imports
rke2_conditional_image_imports: false

# 要下载的系统架构，当前发行版支持 amd64 和 s390x
rke2_architecture: amd64

# RKE2 安装脚本的目标目录
rke2_install_script_dir: /var/tmp

# RKE2 发布通道
rke2_channel: stable

# 不部署指定的 RKE2 内置组件，并删除已部署的对应组件
# 常用值：rke2-coredns、rke2-metrics-server
rke2_disable: []

# 是否禁用 kube-proxy
disable_kube_proxy: false

# RKE2 安装期间部署的自定义 Manifest 路径
# Manifest 支持使用 Jinja2 模板
rke2_custom_manifests: []

# RKE2 安装期间部署的静态 Pod 清单路径
rke2_static_pods: []

# 配置自定义 Containerd 镜像仓库镜像源
rke2_custom_registry_mirrors: []
  # - name:
  #   endpoint: {}
#   rewrite: '"^rancher/(.*)": "mirrorproject/rancher-images/$1"'

# 配置自定义 Containerd 镜像仓库的附加选项
rke2_custom_registry_configs: []
#   - endpoint:
#     config:

# Containerd 镜像仓库配置模板路径
rke2_custom_registry_path: templates/registries.yaml.j2

# RKE2 配置文件模板路径
rke2_config: templates/config.yaml.j2

# etcd 快照源目录
rke2_etcd_snapshot_source_dir: etcd_snapshots

# etcd 快照文件名
# 设置文件名后，首次执行 Ansible 部署时会恢复 etcd
# 恢复仅在首次执行时进行；后续执行即使仍保留该文件名，也不会再次修改 etcd
# 可使用本地快照恢复，或者设置 rke2_etcd_snapshot_s3_options 从 S3 恢复
rke2_etcd_snapshot_file: ""

# 节点上的 etcd 快照目录
rke2_etcd_snapshot_destination_dir: "{{ rke2_data_path }}/server/db/snapshots"

# 可选：etcd 快照计划
# 使用 cron 格式，例如 "0 */12 * * *"
# rke2_etcd_snapshot_schedule: "0 */12 * * *"

# etcd 快照的 S3 存储配置
# 使用 S3 配置，或者设置 rke2_etcd_snapshot_file 和 rke2_etcd_snapshot_source_dir

# rke2_etcd_snapshot_s3_options:
  # https://docs.rke2.io/datastore/backup_restore?_highlight=restore&_highlight=sna&etcdsnap=Multiple+Servers#s3-compatible-object-store-support
  # s3_endpoint: "" # 必填
  # access_key: "" # 必填
  # secret_key: "" # 必填
  # bucket: "" # 必填
  # snapshot_name: "" # 可选；设置后会在首次初始化空集群时恢复 etcd
  # skip_ssl_verify: false # 可选
  # endpoint_ca: "" # 可选
  # region: "" # 可选，默认为 us-east-1
  # folder: "" # 可选，默认为存储桶顶层目录
  # proxy: "" # 可选，连接 S3 时使用的代理，会覆盖相关代理环境变量
  # insecure: false # 可选，禁用 S3 HTTPS
  # timeout: "" # 可选，S3 超时时间，默认为 5m0s
  # s3_retention: 5 # 可选，S3 中保留的快照数量，默认为 5
# 覆盖默认的 Containerd snapshotter
rke2_snapshotter: overlayfs

# 此生产角色仅支持 Cilium CNI
rke2_cni: [cilium]

# 根据选定的安全基准验证系统配置
# RKE2 1.25 之前支持 cis-1.23 或 cis-1.6，RKE2 1.30 及以后使用 cis
rke2_cis_profile: ""

# 将 Kubernetes kubeconfig 下载到 Ansible 控制端
rke2_download_kubeconf: false

# 下载到 Ansible 控制端的 kubeconfig 文件名
rke2_download_kubeconf_file_name: rke2.yaml

# Ansible 控制端存放 kubeconfig 的目标目录
rke2_download_kubeconf_path: /tmp

# RKE2 集群的默认 Ansible Inventory 组名
rke2_cluster_group_name: k8s_cluster

# RKE2 Server 节点的默认 Ansible Inventory 组名
rke2_servers_group_name: masters

# RKE2 Agent 节点的默认 Ansible Inventory 组名
rke2_agents_group_name: workers

# 可选：Kubernetes API Server 参数列表
# 完整参数参见 https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver
# rke2_kube_apiserver_args: []

# 可选：节点标签列表
# k8s_node_label: []

# 可选：附加 RKE2 Server 配置
# 参数参见 https://docs.rke2.io/reference/server_config
# rke2_server_options:
#   - "option: value"
#   - "node-ip: {{ rke2_bind_address }}"  # 示例：节点通告的 IPv4/IPv6 地址

# 可选：附加 RKE2 Agent 配置
# 参数参见 https://docs.rke2.io/reference/linux_agent_config
# rke2_agent_options:
#   - "option: value"
#   - "node-ip: {{ rke2_bind_address }}"  # 示例：节点通告的 IPv4/IPv6 地址

# 可选：配置代理
# 完整配置参见 https://docs.rke2.io/advanced#configuring-an-http-proxy
# rke2_environment_options: []
#   - "option=value"
#   - "HTTP_PROXY=http://your-proxy.example.com:8888"

# 可选：自定义 kube-controller-manager 参数
# 默认参数不存在时追加，已存在时替换
# rke2_kube_controller_manager_arg:
#   - "bind-address=0.0.0.0"

# 可选：自定义 kube-scheduler 参数
# 默认参数不存在时追加，已存在时替换
# rke2_kube_scheduler_arg:
#   - "bind-address=0.0.0.0"

# 可选：通过 HelmChartConfig 配置 Traefik：https://docs.rke2.io/networking/networking_services
# rke2_traefik_values:
#   logs:
#     general:
#       level: "INFO"
rke2_traefik_values: {}

# 升级前封锁并驱逐节点，RKE2 升级完成后解除封锁
rke2_drain_node_during_upgrade: false
# 传递给 kubectl drain 的附加参数，例如 --pod-selector
rke2_drain_additional_args: ""

# 滚动重启期间，在 RKE2 服务重启后等待所有 Pod 进入 Running 或 Succeeded 状态
rke2_wait_for_all_pods_to_be_ready: false
# 滚动重启期间，在 RKE2 服务重启后等待所有 Pod Ready
# 为兼容已有变量名，此变量仍使用 healthy 命名
rke2_wait_for_all_pods_to_be_healthy: false
# 传递给 kubectl wait 命令的参数
rke2_wait_for_all_pods_to_be_healthy_args: --for=condition=Ready -A --all pod --field-selector=metadata.namespace!=kube-system,status.phase!=Succeeded

# 启用 RKE2 服务调试模式
rke2_debug: false

# 可选：使用 KubeletConfiguration 自定义 kubelet 配置：https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
# rke2_kubelet_config:
#   imageGCHighThresholdPercent: 80
#   imageGCLowThresholdPercent: 70
# 同时还需要添加以下 kubelet 参数：
# rke2_kubelet_arg:
#   - "--config=/etc/rancher/rke2/kubelet-config.yaml"
rke2_kubelet_config: {}

# 可选：自定义 kubelet 参数
# rke2_kubelet_arg:
#   - "--system-reserved=cpu=100m,memory=100Mi"

# 可选：自定义 kube-proxy 参数
# rke2_kube_proxy_arg:
#   - "proxy-mode=ipvs"

# 可选：自定义 kube-proxy 附加挂载
# rke2_kube_proxy_extra_mount:
#   - "/lib/modules:/lib/modules:ro"

# node-name 配置项的值
rke2_node_name: "{{ inventory_hostname }}"

# RKE2 默认 Pod 网络 CIDR
rke2_cluster_cidr:
  - 10.42.0.0/16

# RKE2 默认 Service 网络 CIDR
rke2_service_cidr:
  - 10.43.0.0/16
